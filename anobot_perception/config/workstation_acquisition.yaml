workstation_acquisition_server:
  ros__parameters:
    input_pose_topic: /workstation_marker/pose_base
    base_frame: ur_base
    acquired_marker_frame: workstation_marker_acquired
    acquired_grasp_frame: workstation_grasp_acquired
    acquired_pregrasp_frame: workstation_pregrasp_acquired
    sample_count: 15
    acquisition_timeout_s: 5.0
    maximum_input_age_s: 0.25
    maximum_translation_spread_m: 0.005
    maximum_rotation_spread_deg: 1.5
    grasp_x_m: 0.050
    grasp_y_m: 0.125
    grasp_z_m: 0.232
    grasp_roll_deg: 90.0
    grasp_pitch_deg: 0.0
    grasp_yaw_deg: -90.0
    pregrasp_distance_m: 0.10
    publish_rate_hz: 10.0